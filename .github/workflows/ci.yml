name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CASHMESH_TEST_DATABASE_URL: postgresql://cashmesh:cashmesh_ci@127.0.0.1:5432/cashmesh
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
        env:
          POSTGRES_DB: cashmesh
          POSTGRES_PASSWORD: cashmesh_ci
          POSTGRES_USER: cashmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashmesh -d cashmesh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify merchant console
        run: pnpm test:e2e
