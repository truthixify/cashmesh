# Fragment for stock cdk-mintd 0.18.0-rc.3. The processor endpoint is local-only in this fixture.
[[payment_backend]]
backend = "grpcprocessor"
unit = "usdc"
min_mint = 1
max_mint = 25000
min_melt = 1
