[package]
name = "cashmesh-stellar-settlement"
description = "Settlement state and recovery invariants for CashMesh Stellar payouts."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.23.1"
cdk-common = { version = "=0.18.0-rc.3", default-features = false, features = ["mint"] }
cdk-payment-processor = { version = "=0.18.0-rc.3", default-features = false }
futures = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
stellar-base = { version = "=0.7.0", default-features = false }
stellar-horizon = "=0.8.0"
stellar-strkey = "=0.0.18"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
