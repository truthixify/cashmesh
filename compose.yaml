services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      POSTGRES_DB: cashmesh
      POSTGRES_PASSWORD: cashmesh_local
      POSTGRES_USER: cashmesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashmesh -d cashmesh"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cashmesh-postgres-data:/var/lib/postgresql

volumes:
  cashmesh-postgres-data:
